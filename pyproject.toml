[project]
name = "ml-kkbox"
version = "0.1.0"
description = "KKBox 訂閱流失預測與挽回決策系統"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# 依賴按里程碑逐步加入，不一次裝滿。
# 每個套件進來時都要說得出是哪一步需要它（SPEC §10 Q2）。
dependencies = [
    "kaggle>=1.6.17",   # M0 下載競賽資料
    "polars>=1.0",      # M0 資料契約量測，pandas 讀 1.73 GB 會很慢
    "pyyaml>=6.0",      # M0 讀 configs/ 的路徑設定
    "matplotlib>=3.9",  # M0 EDA 圖表
    "pyarrow>=17.0",    # M0 EDA 中間結果快取成 parquet
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# 把專案裝成可匯入的套件（editable 模式）。
#
# 為什麼需要：src/ 底下的模組要能被 scripts/、notebooks/、tests/ 匯入。
# 如果不裝，`from src.config import ...` 只有在「工作目錄剛好是 repo 根目錄」
# 時才成功 —— PyCharm 執行 notebooks/ 裡的檔案時工作目錄可能是 notebooks/，
# 就會 ImportError。裝成套件之後，venv 裡的任何程式在任何目錄都匯得到。
#
# editable 的意思是「安裝的是捷徑不是副本」：改 src/ 的程式碼立刻生效，
# 不用重新 uv sync。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F 基本錯誤 · I import 排序 · UP 語法現代化 · B 常見 bug 樣式
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
